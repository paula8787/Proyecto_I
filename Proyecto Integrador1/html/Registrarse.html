<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | StudyNest</title>
    <link rel="stylesheet" href="../css/Registrarce.css">
</head>
<body>

    <!-- NAV -->
    <nav class="navbar">
        <a class="logo" href="../index.html">StudyNest</a>
    </nav>

    <!-- CONTENEDOR -->
    <div class="wrapper">

        <div class="register-card">

            <!-- Selector -->
            <div class="switcher">
                <button id="tab-arrendador" class="sw-btn active">Arrendador</button>
                <button id="tab-arrendatario" class="sw-btn">Arrendatario</button>
            </div>

            <!-- Form Arrendador -->
            <form id="form-arrendador" class="form active">

                <h2>Registro de Arrendador</h2>

                <div class="input-box">
                    <input type="text" required>
                    <label>Nombre Completo</label>
                </div>

                <div class="input-box">
                    <input type="email" required>
                    <label>Correo Electrónico</label>
                </div>

                <div class="input-box">
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>

                <div class="input-box">
                    <input type="text" pattern="[0-9]{6,10}" required>
                    <label>Cédula</label>
                </div>

                <div class="input-box">
                    <input type="text" pattern="[0-9]{10}" required>
                    <label>Teléfono</label>
                </div>

                <button class="btn" type="submit">Registrarse</button>
            </form>

            <!-- Form Arrendatario -->
            <form id="form-arrendatario" class="form">

                <h2>Registro de Arrendatario</h2>

                <div class="input-box">
                    <input type="text" required>
                    <label>Nombre Completo</label>
                </div>

                <div class="input-box">
                    <input type="email" required>
                    <label>Correo Electrónico</label>
                </div>

                <div class="input-box">
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>

                <div class="input-box">
                    <input type="text" pattern="[0-9]{6,15}" required>
                    <label>Código Estudiantil</label>
                </div>

                <div class="input-box">
                    <input type="text" pattern="[0-9]{10}" required>
                    <label>Teléfono</label>
                </div>

                <button class="btn" type="submit" >Registrarse</button>
            </form>

        </div>

    </div>
    
<div id="toast-container"></div>

    <script src="../js/Registrarce.js"></script>
</body>
</html>
