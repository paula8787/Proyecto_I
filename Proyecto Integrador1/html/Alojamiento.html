<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alojamientos - StudyNest (Mejorado)</title>

    <!-- Estilos integrados para que puedas pegar fácil en tu css/Alojamientos.css si prefieres -->
    <style>
        /* ------------------ TUS ESTILOS COMPLETOS (SIN CAMBIAR NADA) ------------------ */
        :root {
            --bg1: #0f172a;
            --bg2: #1e293b;
            --glass: rgba(255, 255, 255, 0.06);
            --accent: #38bdf8;
            --text: #e6eef8;
        }

        * {
            box-sizing: border-box;
            font-family: Poppins, sans-serif
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text)
        }

        /* NAVBAR */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 36px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 40
        }

        .nav .left {
            display: flex;
            gap: 28px;
            align-items: center
        }

        .logo {
            font-weight: 700;
            font-size: 20px
        }

        .links a {
            color: var(--text);
            text-decoration: none;
            margin-right: 18px;
            opacity: .9
        }

        .links a:hover {
            color: var(--accent)
        }

        .search-box {
            flex: 1;
            display: flex;
            justify-content: center
        }

        .search-box input {
            width: 60%;
            max-width: 520px;
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            background: var(--glass);
            color: var(--text)
        }

        .right {
            display: flex;
            gap: 14px;
            align-items: center
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff6b6b;
            color: #fff;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 999px
        }

        /* CONTENIDO */
        .container {
            padding: 28px 36px
        }

        .filters {
            display: flex;
            gap: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            margin-bottom: 22px
        }

        /* SELECT Y INPUTS DE FILTROS */
        .filters input,
        .filters select {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        /* Mejora visual del select */
        .filters select {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        .filters select option {
            background: #0f172a;
            color: #e6eef8;
            padding: 6px;
        }

        .tag-dropdown {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 300;
        }

        .tag-dropdown div {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .tag-dropdown div:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        /* GRID CONTENIDO */
        .content {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 22px
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .card {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            align-items: center;
            transition: transform .18s
        }

        .card:hover {
            transform: translateY(-4px)
        }

        .card img {
            width: 140px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px
        }

        .info {
            flex: 1
        }

        .info h3 {
            margin: 0;
            font-size: 16px
        }

        .desc {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 6px
        }

        .meta {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px
        }

        .price {
            color: var(--accent);
            font-weight: 700
        }

        .actions {
            display: flex;
            gap: 8px
        }

        .btn {
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: #002;
            font-weight: 600
        }

        .btn.ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text)
        }

        .fav {
            font-size: 20px;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px;
            border-radius: 999px;
            color: #fff;
            border: none;
            cursor: pointer
        }

        /* SIDEBAR / MAPA */
        .side {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 12px
        }

        #map {
            height: 420px;
            border-radius: 10px;
            overflow: hidden
        }

        #map {
            position: relative;
            z-index: 1;
            /* bajo */
        }

        /* MODAL */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 80
        }

        .modal {
            width: min(720px, 94%);
            background: #071025;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05)
        }

        .modal .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .modal h3 {
            margin: 0 0 8px 0
        }

        .modal p {
            color: #cbd5e1
        }

        .modal .close {
            float: right;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer
        }

        /* NOTIFICACIONES */
        #toast-container {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 500;
        }

        .toast {
            background: rgba(5, 32, 43, 0.95);
            padding: 14px 18px;
            border-radius: 10px;
            color: #dff7ff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            animation: toastFadeIn .35s ease-out;
        }

        @keyframes toastFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === NOTIFICACIONES MEJORADAS === */

        .notif-dropdown {
            position: absolute;
            right: 18px;
            top: 56px;
            background: rgba(15, 23, 42, 0.96);
            padding: 14px;
            border-radius: 14px;
            width: 320px;
            max-height: 380px;
            overflow-y: auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;

            z-index: 999999 !important;
            /* 🔥 MÁS ALTO QUE TODO */
            position: fixed;
            /* 🔥 FIXED para no quedar dentro del contenedor del mapa */
            pointer-events: auto;
            /* Asegura que puedes interactuar */
        }


        .notif-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin-bottom: 10px;
            transition: background .2s ease;
        }

        .notif-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .notif-item:last-child {
            margin-bottom: 0;
        }

        /* RESPONSIVE */
        @media(max-width:920px) {
            .content {
                grid-template-columns: 1fr
            }

            .search-box input {
                width: 90%
            }

            .side {
                order: 2
            }

            .notif-dropdown {
                right: 8px;
                width: 92vw
            }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="left">
            <div class="logo">StudyNest</div>
            <div class="links">
                <a href="../index.html">Inicio</a>
                <a href="#">Alojamientos</a>
                <a href="#">Subsidios</a>
            </div>
        </div>

        <div class="search-box">
            <input id="globalSearch" type="text" placeholder="Buscar alojamiento, descripción o servicio...">
        </div>

        <div class="right">
            <button id="notifBtn" class="icon-btn" title="Notificaciones">
                🔔 <span id="notifBadge" class="badge" style="display:none">0</span>
            </button>
            <div id="notifDropdown" class="notif-dropdown" aria-hidden="true"></div>
            <button id="profileBtn" class="icon-btn" title="Perfil">👤</button>
        </div>
    </nav>

    <main class="container">
        <section class="filters">
            <input id="filterText" type="text" placeholder="Filtrar por nombre o servicio">
            <select id="sortPrice">
                <option value="">Orden</option>
                <option>Menor a mayor</option>
                <option>Mayor a menor</option>
            </select>
            <select id="typeSelect">
                <option value="">Tipo</option>
                <option>Habitación</option>
                <option>Apartaestudio</option>
            </select>
            <select id="womenOnly">
                <option value="">Género</option>
                <option value="true">Solo mujeres</option>
                <option value="false">Mixto</option>
            </select>
        </section>

        <section class="content">
            <div>
                <div class="list" id="list"></div>
            </div>

            <aside class="side">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <strong>Mapa</strong>
                    <small id="mapCount">0 alojamientos</small>
                </div>
                <div id="map"></div>
            </aside>
        </section>
    </main>

    <div id="toast-container"></div>
    <div id="modal-root"></div>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



    <script>
        /* ================== JS CORREGIDO PARA ALOJAMIENTO ================== */
        /* Pegar en Alojamiento.html reemplazando el <script> actual */

        (() => {
            const defaultAlojamientos = [
                { id: "a1", nombre: "Habitación cerca de UFPSO", desc: "Habitación amoblada, con baño privado.", precio: 350000, tipo: "Habitación", lat: 8.237, lon: -73.356, servicios: ["wifi", "agua"], soloMujeres: false, fotos: ["https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg"] },
                { id: "a2", nombre: "Apartaestudio moderno", desc: "Incluye servicios y wifi.", precio: 520000, tipo: "Apartaestudio", lat: 8.235, lon: -73.353, servicios: ["wifi", "energia"], soloMujeres: false, fotos: ["https://images.pexels.com/photos/271743/pexels-photo-271743.jpeg"] },
                { id: "a3", nombre: "Cuarto económico", desc: "Ideal para estudiantes.", precio: 280000, tipo: "Habitación", lat: 8.239, lon: -73.358, servicios: ["agua"], soloMujeres: true, fotos: ["https://images.pexels.com/photos/678247/pexels-photo-678247.jpeg"] }
            ];

            // Storage helpers
            function getAlojamientosRaw() {
                return JSON.parse(localStorage.getItem('alojamientos') || JSON.stringify(defaultAlojamientos));
            }
            function saveAlojamientos(v) { localStorage.setItem('alojamientos', JSON.stringify(v)); }
            function getFavorites() { return JSON.parse(localStorage.getItem('favoritos') || '[]'); }
            function saveFavorites(v) { localStorage.setItem('favoritos', JSON.stringify(v)); }
            function getReservations() { return JSON.parse(localStorage.getItem('reservas') || '[]'); }
            function saveReservations(v) { localStorage.setItem('reservas', JSON.stringify(v)); }
            function getNotifications() { return JSON.parse(localStorage.getItem('notifications') || '[]'); }
            function saveNotifications(v) { localStorage.setItem('notifications', JSON.stringify(v)); }
            function getCurrentUser() { return JSON.parse(localStorage.getItem('currentUser') || 'null'); }

            // Normalizar precios y devolver copia nueva (para evitar mutar localStorage accidentalmente)
            function normalizarPrecios(items) {
                return items.map(a => {
                    const copy = { ...a };
                    // Si precio es string o tiene símbolos, extraer números
                    if (typeof copy.precio === 'string') {
                        copy.precio = Number(copy.precio.replace(/[^0-9]/g, '')) || 0;
                    } else {
                        copy.precio = Number(copy.precio) || 0;
                    }
                    return copy;
                });
            }

            // Map
            let map = null;
            let markers = [];
            function initMap() {
                try {
                    // habilitar scrollWheelZoom: true (el usuario pidió que cambie con rueda)
                    map = L.map('map', { scrollWheelZoom: true }).setView([8.2377, -73.3560], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                } catch (e) { console.warn('Leaflet no disponible', e); }
            }
            function clearMarkers() { markers.forEach(m => map && map.removeLayer(m)); markers = []; }

            // Render
            const listEl = document.getElementById('list');
            function renderAlojamientos(items) {
                listEl.innerHTML = '';
                clearMarkers();
                const favs = getFavorites();

                items.forEach(a => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const img = document.createElement('img');
                    img.src = a.fotos?.[0] || '';

                    const info = document.createElement('div');
                    info.className = 'info';

                    const h3 = document.createElement('h3');
                    h3.textContent = a.nombre;

                    const p = document.createElement('p');
                    p.className = 'desc';
                    p.textContent = a.desc;

                    const meta = document.createElement('div');
                    meta.className = 'meta';

                    const price = document.createElement('div');
                    price.className = 'price';
                    // mostrar precio con separador (asume precio numérico)
                    price.textContent = '$' + (Number(a.precio) || 0).toLocaleString('es-CO') + '/mes';

                    const actions = document.createElement('div');
                    actions.className = 'actions';

                    // favorito
                    const favBtn = document.createElement('button');
                    favBtn.className = 'fav';
                    favBtn.innerHTML = favs.includes(a.id) ? '♥' : '♡';
                    favBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorito(a.id, favBtn); });

                    // ver detalle
                    const verBtn = document.createElement('button');
                    verBtn.className = 'btn ghost';
                    verBtn.textContent = 'Ver';
                    verBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // abrir detalle con id
                        window.location.href = "./detalle-alojamiento.html?id=" + encodeURIComponent(a.id);
                    });

                    // reservar -> chat
                    const reservarBtn = document.createElement('button');
                    reservarBtn.className = 'btn';
                    reservarBtn.textContent = 'Reservar';
                    reservarBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.location.href = "./chat.html?id=" + encodeURIComponent(a.id);
                    });

                    actions.appendChild(favBtn);
                    actions.appendChild(verBtn);
                    actions.appendChild(reservarBtn);

                    info.appendChild(h3);
                    info.appendChild(p);
                    meta.appendChild(price);
                    meta.appendChild(actions);
                    info.appendChild(meta);

                    card.appendChild(img);
                    card.appendChild(info);
                    listEl.appendChild(card);

                    // marker
                    if (map && a.lat && a.lon) {
                        const m = L.marker([a.lat, a.lon]).addTo(map).bindPopup(`<b>${a.nombre}</b><div>${a.desc}</div>`);
                        markers.push(m);
                    }
                });

                const mapCount = document.getElementById('mapCount');
                if (mapCount) mapCount.textContent = items.length + ' alojamientos';
            }

            // Favoritos
            function toggleFavorito(id, btn) {
                const fav = getFavorites();
                const i = fav.indexOf(id);
                if (i > -1) { fav.splice(i, 1); btn.innerHTML = '♡'; toast('Eliminado de favoritos'); }
                else { fav.push(id); btn.innerHTML = '♥'; toast('Agregado a favoritos'); }
                saveFavorites(fav);
            }

            // Modal helpers
            function showModal(html) {
                const root = document.getElementById('modal-root');
                root.innerHTML = `<div class="modal-backdrop">${html}</div>`;
                root.querySelector('.modal-backdrop').addEventListener('click', e => {
                    if (e.target.classList.contains('modal-backdrop')) root.innerHTML = '';
                });
            }
            function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

            // Notificaciones UI
            const notifBtn = document.getElementById('notifBtn');
            const notifDropdown = document.getElementById('notifDropdown');

            // Render notificaciones en dropdown (usa position: fixed en CSS)
            function renderNotifDropdown() {
                const nots = getNotifications();
                if (!notifDropdown) return;
                if (nots.length === 0) { notifDropdown.innerHTML = '<div class="notif-item">No hay notificaciones</div>'; return; }

                notifDropdown.innerHTML = nots.map(n => `
      <div class="notif-item">
        <strong>${escapeHtml(n.title)}</strong>
        <div style="font-size:13px;color:#cbd5e1">${escapeHtml(n.body)}</div>
        <small style="opacity:.6">${new Date(n.date).toLocaleString()}</small>
      </div>
    `).join('');

                // marcar como leídas
                const marked = nots.map(x => ({ ...x, read: true }));
                saveNotifications(marked);
                updateNotifBadge();
            }

            // Toggle dropdown con manejo de eventos (evitar que click en botón cierre inmediatamente)
            if (notifBtn) {
                notifBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // evita que document 'click' lo cierre
                    if (!notifDropdown) return;
                    const open = notifDropdown.style.display === 'block';
                    if (open) notifDropdown.style.display = 'none';
                    else { renderNotifDropdown(); notifDropdown.style.display = 'block'; }
                });
            }

            // Cerrar dropdown click fuera
            document.addEventListener('click', (e) => {
                if (!notifDropdown) return;
                // si el click está fuera del dropdown y fuera del botón, cerramos
                if (!notifDropdown.contains(e.target) && !(notifBtn && notifBtn.contains(e.target))) {
                    notifDropdown.style.display = 'none';
                }
            });

            function updateNotifBadge() {
                const b = document.getElementById('notifBadge');
                if (!b) return;
                const unread = getNotifications().filter(n => !n.read).length;
                if (unread > 0) { b.style.display = 'inline-block'; b.textContent = unread; }
                else { b.style.display = 'none'; }
            }

            // Toasts
            function toast(msg) {
                const c = document.getElementById('toast-container');
                if (!c) return;
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => t.remove(), 3800);
            }

            // Escape minimal para evitar inyección en notifs
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; });
            }

            // Filters + sorting
            function applyFilters() {
                const q = (document.getElementById('filterText')?.value || '').toLowerCase();
                const sort = document.getElementById('sortPrice')?.value || '';
                const type = document.getElementById('typeSelect')?.value || '';
                const women = document.getElementById('womenOnly')?.value || '';

                // obtenemos y normalizamos precios
                let items = normalizarPrecios(getAlojamientosRaw());

                if (q) {
                    items = items.filter(a => (a.nombre + ' ' + a.desc + ' ' + (a.servicios || []).join(' ')).toLowerCase().includes(q));
                }
                if (type) items = items.filter(a => a.tipo === type);
                if (women) items = items.filter(a => String(a.soloMujeres) === women);

                // Ordenar según select (las opciones en HTML usan exactamente estos textos)
                if (sort === 'Menor a mayor') {
                    items.sort((x, y) => Number(x.precio) - Number(y.precio));
                } else if (sort === 'Mayor a menor') {
                    items.sort((x, y) => Number(y.precio) - Number(x.precio));
                }

                renderAlojamientos(items);

                if (map) {
                    clearMarkers();
                    items.forEach(a => {
                        if (a.lat && a.lon) {
                            const m = L.marker([a.lat, a.lon]).addTo(map).bindPopup(`<b>${a.nombre}</b>`);
                            markers.push(m);
                        }
                    });
                    if (items[0] && items[0].lat) map.setView([items[0].lat, items[0].lon], 14);
                }
            }

            // Exponer alguna utilidad para debugging (opcional)
            window.__study = {
                resetLocalAlojamientos: () => { localStorage.removeItem('alojamientos'); location.reload(); },
                getRawAlojamientos: getAlojamientosRaw,
                normalize: normalizarPrecios
            };

            // Init
            document.addEventListener('DOMContentLoaded', () => {
                initMap();
                // Si en localStorage hay alojamientos con precio mal guardado, normalizar no persiste automáticamente.
                // Si quieres limpiar localStorage y usar solo defaults, ejecuta en consola: localStorage.removeItem('alojamientos')
                renderAlojamientos(normalizarPrecios(getAlojamientosRaw()));
                applyFilters();
                updateNotifBadge();

                // Listeners
                document.getElementById('filterText')?.addEventListener('input', applyFilters);
                document.getElementById('globalSearch')?.addEventListener('input', e => {
                    const v = e.target.value || '';
                    const f = document.getElementById('filterText');
                    if (f) f.value = v;
                    applyFilters();
                });
                document.getElementById('sortPrice')?.addEventListener('change', applyFilters);
                document.getElementById('typeSelect')?.addEventListener('change', applyFilters);
                document.getElementById('womenOnly')?.addEventListener('change', applyFilters);
            });

        })();
    </script>

</body>

</html>
