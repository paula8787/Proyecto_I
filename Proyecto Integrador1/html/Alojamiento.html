<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alojamientos - StudyNest (Mejorado)</title>

    <!-- Estilos integrados -->
    <style>
        :root {
            --bg1: #0f172a;
            --bg2: #1e293b;
            --glass: rgba(255, 255, 255, 0.06);
            --accent: #38bdf8;
            --accent-2: #5ed8ff;
            --text: #e6eef8;
            --muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }

        /* NAVBAR */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 26px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 60;
        }

        .nav .left {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            color: var(--accent);
        }

        .links a {
            color: var(--text);
            text-decoration: none;
            margin-right: 14px;
            opacity: .95;
            font-weight: 500;
        }

        .links a:hover {
            color: var(--accent-2);
        }

        .search-box {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 0 12px;
        }

        .search-box input {
            width: 60%;
            max-width: 520px;
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            background: var(--glass);
            color: var(--text);
        }

        .right {
            display: flex;
            gap: 8px;
            align-items: center;
            position: relative;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
            padding: 8px;
            border-radius: 8px;
            color: var(--text);
            font-size: 18px;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.02);
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff6b6b;
            color: #fff;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 999px;
            display: inline-block;
            min-width: 18px;
            text-align: center;
        }

        /* Perfil dropdown */
        .profile-dropdown {
            position: fixed;
            right: 18px;
            top: 56px;
            width: 220px;
            background: rgba(15,23,42,0.98);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            padding: 8px;
            z-index: 999999;
            display: none;
        }

        .profile-dropdown .item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .profile-dropdown .item:hover {
            background: rgba(56,189,248,0.08);
        }

        .profile-dropdown .item .label {
            font-size: 14px;
            color: var(--text);
        }

        /* NOTIFICACIONES */
        .notif-dropdown {
            position: fixed;
            right: 260px;
            top: 56px;
            background: rgba(15, 23, 42, 0.98);
            padding: 12px;
            border-radius: 12px;
            width: 360px;
            max-height: 420px;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 999998;
            display: none;
        }

        .notif-item {
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            margin-bottom: 10px;
        }

        .notif-item strong { display:block; color:var(--text); }
        .notif-item small { color: var(--muted); display:block; margin-top:6px; font-size:12px; }

        /* Main layout */
        .container {
            padding: 22px 28px;
            max-width: 1150px;
            margin: 0 auto;
        }

        .filters {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin-bottom: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.04);
            color: var(--text);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 18px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.02);
            padding: 14px;
            border-radius: 12px;
            align-items: center;
            transition: transform .14s, box-shadow .14s;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .card img {
            width: 150px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .info {
            flex: 1;
        }

        .info h3 {
            margin: 0;
            font-size: 16px;
        }

        .desc {
            color: var(--muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .meta {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 8px;
            justify-content: space-between;
        }

        .left-meta { display:flex; gap:12px; align-items:center; }
        .price {
            color: var(--accent);
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: #002;
            font-weight: 600;
        }

        .btn.ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text);
        }

        .fav {
            font-size: 18px;
            background: rgba(0,0,0,0.18);
            padding: 8px;
            border-radius: 999px;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .side {
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            position: relative;
        }

        #map {
            height: 420px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.02);
        }

        /* Toasts */
        #toast-container {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1200;
        }

        .toast {
            background: rgba(5, 32, 43, 0.96);
            padding: 12px 16px;
            border-radius: 10px;
            color: #cfeffb;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            animation: toastFadeIn .35s ease-out;
        }

        @keyframes toastFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media(max-width: 920px) {
            .content { grid-template-columns: 1fr; }
            .notif-dropdown { right: 12px; width: calc(100% - 24px); top: 64px; }
            .profile-dropdown { right: 12px; top: 64px; }
            .search-box input { width: 90%; }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="left">
            <div class="logo">StudyNest</div>
            <div class="links">
                <a href="../index.html">Inicio</a>
                <a href="SobreN.html">Sobre Nosotros</a>
            </div>
        </div>

        <div class="search-box">
            <input id="globalSearch" type="text" placeholder="Buscar alojamiento, descripción o servicio...">
        </div>

        <div class="right">
            <button id="notifBtn" class="icon-btn" title="Notificaciones">🔔
                <span id="notifBadge" class="badge" style="display:none">0</span>
            </button>

            <button id="profileBtn" class="icon-btn" title="Perfil" aria-haspopup="true" aria-expanded="false">
                <!-- icono perfil (simple) -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:middle">
                    <path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="#e6eef8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 21v-1a6 6 0 00-6-6H10a6 6 0 00-6 6v1" stroke="#e6eef8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- perfil dropdown -->
    <div id="profileDropdown" class="profile-dropdown" role="menu" aria-hidden="true">
        <div class="item" id="miPerfilBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="#cfeffb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">Mi perfil</div></div>
        <div class="item" id="misFavsBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20.8 4.6c-1.4-1.6-3.9-1.7-5.4-.2L12 7.2 8.6 4.4C7.1 3 4.6 3 3.2 4.6s-1.3 4.1.2 5.6L12 18.5l8.6-8.3c1.5-1.5 1.5-4 0-5.6z" stroke="#cfeffb" stroke-width="0.6" /></svg><div class="label">Mis favoritos</div></div>
        <div class="item" id="misReservasBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 7V3m8 4V3M3 11h18M5 21h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v11a2 2 0 002 2z" stroke="#cfeffb" stroke-width="0.7"/></svg><div class="label">Mis reservas</div></div>
        <div class="item" id="logoutBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="#cfeffb" stroke-width="0.9"/><path d="M16 17l5-5-5-5" stroke="#cfeffb" stroke-width="0.9"/></svg><div class="label">Cerrar sesión</div></div>
    </div>

    <!-- notificaciones dropdown -->
    <div id="notifDropdown" class="notif-dropdown" aria-hidden="true"></div>

    <main class="container">
        <section class="filters" aria-label="Filtros">
            <input id="filterText" type="text" placeholder="Filtrar por nombre o servicio">
            <select id="sortPrice" title="Ordenar por precio">
                <option value="">Orden</option>
                <option>Menor a mayor</option>
                <option>Mayor a menor</option>
            </select>
            <select id="typeSelect" title="Tipo">
                <option value="">Tipo</option>
                <option>Habitación</option>
                <option>Apartaestudio</option>
            </select>
            <select id="womenOnly" title="Género">
                <option value="">Género</option>
                <option value="true">Solo mujeres</option>
                <option value="false">Mixto</option>
            </select>
            <div style="margin-left:auto;font-size:13px;color:var(--muted)">Alojamientos disponibles</div>
        </section>

        <section class="content" aria-live="polite">
            <div>
                <div class="list" id="list" role="list"></div>
            </div>

            <aside class="side" aria-label="Mapa">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <strong>Mapa</strong>
                    <small id="mapCount">0 alojamientos</small>
                </div>
                <div id="map" role="application" aria-label="Mapa de alojamientos"></div>
            </aside>
        </section>
    </main>

    <div id="toast-container"></div>
    <div id="modal-root"></div>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        (function () {
            /* --------------- DATOS POR DEFECTO --------------- */
            const defaultAlojamientos = [
                { id: "a1", nombre: "Habitación cerca de UFPSO", desc: "Habitación amoblada, con baño privado.", precio: 350000, tipo: "Habitación", lat: 8.237, lon: -73.356, servicios: ["wifi", "agua"], soloMujeres: false, fotos: ["https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg"] },
                { id: "a2", nombre: "Apartaestudio moderno", desc: "Incluye servicios y wifi.", precio: 520000, tipo: "Apartaestudio", lat: 8.235, lon: -73.353, servicios: ["wifi", "energia"], soloMujeres: false, fotos: ["https://images.pexels.com/photos/271743/pexels-photo-271743.jpeg"] },
                { id: "a3", nombre: "Cuarto económico", desc: "Ideal para estudiantes.", precio: 280000, tipo: "Habitación", lat: 8.239, lon: -73.358, servicios: ["agua"], soloMujeres: true, fotos: ["https://images.pexels.com/photos/678247/pexels-photo-678247.jpeg"] }
            ];

            /* --------------- HELPERS STORAGE --------------- */
            function getAlojamientos() { return JSON.parse(localStorage.getItem('alojamientos') || JSON.stringify(defaultAlojamientos)); }
            function saveAlojamientos(v) { localStorage.setItem('alojamientos', JSON.stringify(v)); }
            function getFavorites() { return JSON.parse(localStorage.getItem('favoritos') || '[]'); }
            function saveFavorites(v) { localStorage.setItem('favoritos', JSON.stringify(v)); }
            function getReservations() { return JSON.parse(localStorage.getItem('reservas') || '[]'); }
            function saveReservations(v) { localStorage.setItem('reservas', JSON.stringify(v)); }
            function getNotifications() { return JSON.parse(localStorage.getItem('notifications') || '[]'); }
            function saveNotifications(v) { localStorage.setItem('notifications', JSON.stringify(v)); }
            function getCurrentUser() { return JSON.parse(localStorage.getItem('currentUser') || 'null'); }

            /* --------------- NORMALIZAR PRECIOS --------------- */
            function normalizarPrecios(items) {
                return items.map(a => {
                    const copy = { ...a };
                    if (typeof copy.precio === 'string') copy.precio = Number(copy.precio.replace(/[^0-9]/g, '')) || 0;
                    else copy.precio = Number(copy.precio) || 0;
                    return copy;
                });
            }

            /* --------------- MAPA --------------- */
            let map = null;
            let markers = [];
            function initMap() {
                try {
                    map = L.map('map', { scrollWheelZoom: true }).setView([8.2377, -73.3560], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                } catch (e) { console.warn('Leaflet no disponible', e); }
            }
            function clearMarkers() { markers.forEach(m => map && map.removeLayer(m)); markers = []; }

            /* --------------- RENDER ALOJAMIENTOS --------------- */
            const listEl = document.getElementById('list');
            function renderAlojamientos(items) {
                listEl.innerHTML = '';
                clearMarkers();
                const favs = getFavorites();

                items.forEach(a => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('role', 'listitem');

                    const img = document.createElement('img');
                    img.src = a.fotos?.[0] || '';

                    const info = document.createElement('div');
                    info.className = 'info';

                    const h3 = document.createElement('h3');
                    h3.textContent = a.nombre;

                    const p = document.createElement('p');
                    p.className = 'desc';
                    p.textContent = a.desc;

                    const meta = document.createElement('div');
                    meta.className = 'meta';

                    const leftMeta = document.createElement('div');
                    leftMeta.className = 'left-meta';

                    const price = document.createElement('div');
                    price.className = 'price';
                    price.textContent = '$' + (Number(a.precio) || 0).toLocaleString('es-CO') + '/mes';

                    const actions = document.createElement('div');
                    actions.className = 'actions';

                    // favorito
                    const favBtn = document.createElement('button');
                    favBtn.className = 'fav';
                    favBtn.title = 'Agregar a favoritos';
                    favBtn.innerHTML = favs.includes(a.id) ? '♥' : '♡';
                    favBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorito(a.id, favBtn); });

                    // ver detalle
                    const verBtn = document.createElement('button');
                    verBtn.className = 'btn ghost';
                    verBtn.textContent = 'Ver';
                    verBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.location.href = "./detalle-alojamiento.html?id=" + encodeURIComponent(a.id);
                    });

                    // reservar -> chat
                    const reservarBtn = document.createElement('button');
                    reservarBtn.className = 'btn';
                    reservarBtn.textContent = 'Reservar';
                    reservarBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // crear notificación de intento de reserva para el dueño (ejemplo)
                        const nots = getNotifications();
                        nots.unshift({
                            id: 'n_' + Date.now(),
                            title: 'Intento de contacto',
                            body: `Alguien quiere reservar ${a.nombre}.`,
                            date: new Date().toISOString(),
                            read: false
                        });
                        saveNotifications(nots);
                        updateNotifBadge();
                        window.location.href = "./chat.html?id=" + encodeURIComponent(a.id);
                    });

                    actions.appendChild(favBtn);
                    actions.appendChild(verBtn);
                    actions.appendChild(reservarBtn);

                    leftMeta.appendChild(price);

                    meta.appendChild(leftMeta);
                    meta.appendChild(actions);

                    info.appendChild(h3);
                    info.appendChild(p);
                    info.appendChild(meta);

                    card.appendChild(img);
                    card.appendChild(info);
                    listEl.appendChild(card);

                    // marker
                    if (map && a.lat && a.lon) {
                        const m = L.marker([a.lat, a.lon]).addTo(map).bindPopup(`<b>${escapeHtml(a.nombre)}</b><div>${escapeHtml(a.desc)}</div>`);
                        markers.push(m);
                    }
                });

                const mapCount = document.getElementById('mapCount');
                if (mapCount) mapCount.textContent = items.length + ' alojamientos';
            }

            function toggleFavorito(id, btn) {
                const fav = getFavorites();
                const i = fav.indexOf(id);
                if (i > -1) { fav.splice(i, 1); btn.innerHTML = '♡'; toast('Eliminado de favoritos'); }
                else { fav.push(id); btn.innerHTML = '♥'; toast('Agregado a favoritos'); }
                saveFavorites(fav);
            }

            /* --------------- NOTIFICACIONES --------------- */
            const notifBtn = document.getElementById('notifBtn');
            const notifDropdown = document.getElementById('notifDropdown');

            // cargar notificaciones de ejemplo si no hay
            (function seedNotificationsIfEmpty() {
                const nots = getNotifications();
                if (!nots || nots.length === 0) {
                    const sample = [
                        { id: 'n_' + Date.now(), title: 'Nueva reserva', body: 'Laura intentó reservar "Habitación cerca de UFPSO".', date: new Date().toISOString(), read: false },
                        { id: 'n_' + (Date.now() + 1), title: 'Mensaje nuevo', body: 'Carlos te envió un mensaje en el chat.', date: new Date().toISOString(), read: false }
                    ];
                    saveNotifications(sample);
                }
            })();

            function renderNotifDropdown() {
                const nots = getNotifications();
                if (!notifDropdown) return;
                if (!nots || nots.length === 0) { notifDropdown.innerHTML = '<div class="notif-item">No hay notificaciones</div>'; return; }

                notifDropdown.innerHTML = nots.map(n => `
                    <div class="notif-item">
                        <strong>${escapeHtml(n.title)}</strong>
                        <div style="font-size:13px;color:var(--muted)">${escapeHtml(n.body)}</div>
                        <small>${new Date(n.date).toLocaleString()}</small>
                    </div>
                `).join('');

                // marcar como leídas
                const marked = nots.map(x => ({ ...x, read: true }));
                saveNotifications(marked);
                updateNotifBadge();
            }

            if (notifBtn) {
                notifBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!notifDropdown) return;
                    const open = notifDropdown.style.display === 'block';
                    if (open) notifDropdown.style.display = 'none';
                    else { renderNotifDropdown(); notifDropdown.style.display = 'block'; }
                });
            }

            function updateNotifBadge() {
                const b = document.getElementById('notifBadge');
                if (!b) return;
                const unread = (getNotifications() || []).filter(n => !n.read).length;
                if (unread > 0) { b.style.display = 'inline-block'; b.textContent = unread; }
                else { b.style.display = 'none'; }
            }

            /* --------------- PROFILE DROPDOWN --------------- */
            const profileBtn = document.getElementById('profileBtn');
            const profileDropdown = document.getElementById('profileDropdown');

            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.style.display = profileDropdown.style.display === 'block' ? 'none' : 'block';
                profileBtn.setAttribute('aria-expanded', profileDropdown.style.display === 'block');
            });

            // profile actions
            document.getElementById('miPerfilBtn').addEventListener('click', () => {
                profileDropdown.style.display = 'none';
                // aquí redirigir o abrir modal real: window.location.href = './perfil.html';
            });
            document.getElementById('misFavsBtn').addEventListener('click', () => {
                profileDropdown.style.display = 'none';
                // ejemplo: window.location.href = './favoritos.html';
            });
            document.getElementById('misReservasBtn').addEventListener('click', () => {
                profileDropdown.style.display = 'none';
                // ejemplo: window.location.href = './reservas.html';
            });
            document.getElementById('logoutBtn').addEventListener('click', () => {
                profileDropdown.style.display = 'none';
                localStorage.removeItem('currentUser');
                toast('Sesión cerrada (simulado)');
                window.location.href = '../index.html';
            });

            // click fuera cierra dropdowns
            document.addEventListener('click', (e) => {
                if (notifDropdown && !notifDropdown.contains(e.target) && !(notifBtn && notifBtn.contains(e.target))) notifDropdown.style.display = 'none';
                if (profileDropdown && !profileDropdown.contains(e.target) && !(profileBtn && profileBtn.contains(e.target))) profileDropdown.style.display = 'none';
            });

            /* --------------- TOAST --------------- */
            function toast(msg) {
                const c = document.getElementById('toast-container');
                if (!c) return;
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => t.remove(), 3800);
            }

            /* --------------- ESCAPE HTML --------------- */
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; });
            }

            /* --------------- FILTERS + SORT --------------- */
            function applyFilters() {
                const q = (document.getElementById('filterText')?.value || '').toLowerCase();
                const sort = document.getElementById('sortPrice')?.value || '';
                const type = document.getElementById('typeSelect')?.value || '';
                const women = document.getElementById('womenOnly')?.value || '';

                let items = normalizarPrecios(getAlojamientos());

                if (q) {
                    items = items.filter(a => (a.nombre + ' ' + a.desc + ' ' + (a.servicios || []).join(' ')).toLowerCase().includes(q));
                }
                if (type) items = items.filter(a => a.tipo === type);
                if (women) items = items.filter(a => String(a.soloMujeres) === women);

                // Orden correcto numérico
                if (sort === 'Menor a mayor') items.sort((x, y) => Number(x.precio) - Number(y.precio));
                else if (sort === 'Mayor a menor') items.sort((x, y) => Number(y.precio) - Number(x.precio));

                renderAlojamientos(items);

                if (map) {
                    clearMarkers();
                    items.forEach(a => {
                        if (a.lat && a.lon) {
                            const m = L.marker([a.lat, a.lon]).addTo(map).bindPopup(`<b>${escapeHtml(a.nombre)}</b>`);
                            markers.push(m);
                        }
                    });
                    if (items[0] && items[0].lat) map.setView([items[0].lat, items[0].lon], 14);
                }
            }

            /* --------------- INICIALIZAR --------------- */
            document.addEventListener('DOMContentLoaded', () => {
                initMap();
                // render inicial
                renderAlojamientos(normalizarPrecios(getAlojamientos()));
                applyFilters();
                updateNotifBadge();

                // eventos
                document.getElementById('filterText')?.addEventListener('input', applyFilters);
                document.getElementById('globalSearch')?.addEventListener('input', e => {
                    const v = e.target.value || '';
                    const f = document.getElementById('filterText');
                    if (f) f.value = v;
                    applyFilters();
                });
                document.getElementById('sortPrice')?.addEventListener('change', applyFilters);
                document.getElementById('typeSelect')?.addEventListener('change', applyFilters);
                document.getElementById('womenOnly')?.addEventListener('change', applyFilters);
            });

            // Exponer utilidades (debug)
            window.__studyAlojamientos = {
                seedDefaults: () => { localStorage.removeItem('alojamientos'); location.reload(); },
                getAlojamientos, getNotifications, saveNotifications
            };

        })();
    </script>
</body>

</html>
